<!-- Quote Modal -->
<div class="modal fade" id="quoteModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">

    <div class="modal-content">

      <div class="modal-header">

        <h4 class="modal-title">
          Request a Quote
        </h4>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal">
        </button>

      </div>

      <div class="modal-body">

        <form id="quoteForm">

          <div class="row">

            <div class="col-md-6 mb-3">

              <label>Product / Service</label>

              <input
                type="text"
                id="quoteSubject"
                class="form-control"
                readonly>

            </div>

            <div class="col-md-6 mb-3">

              <label>Your Name *</label>

              <input
                type="text"
                id="customerName"
                class="form-control"
                required>

            </div>

            <div class="col-md-6 mb-3">

              <label>Company Name</label>

              <input
                type="text"
                id="companyName"
                class="form-control">

            </div>

            <div class="col-md-6 mb-3">

              <label>Phone *</label>

              <input
                type="text"
                id="phone"
                class="form-control"
                required>

            </div>

            <div class="col-md-6 mb-3">

              <label>Email</label>

              <input
                type="email"
                id="email"
                class="form-control">

            </div>

            <div class="col-md-6 mb-3">

              <label>City</label>

              <input
                type="text"
                id="city"
                class="form-control">

            </div>

            <div class="col-12 mb-3">

              <label>Your Requirement</label>

              <textarea
                id="message"
                rows="5"
                class="form-control">
              </textarea>

            </div>

          </div>

          <div class="text-end">

            <button
              type="submit"
              class="btn btn-warning">

              Submit Request

            </button>

          </div>

        </form>

      </div>

    </div>

  </div>
</div>
