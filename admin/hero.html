<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Banner - AMTEC Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="../css/sidebar.css">

<style>

.page{
    padding:35px;
}

.page h2{
    color:#0A4A8A;
    margin-bottom:25px;
}

.form-box{
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    max-width:700px;
}

.form-box label{
    display:block;
    margin-top:18px;
    margin-bottom:8px;
    font-weight:600;
}

.form-box input,
.form-box textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.form-box button{
    margin-top:25px;
    background:#0A4A8A;
    color:#fff;
    border:none;
    padding:12px 30px;
    border-radius:8px;
    cursor:pointer;
}

.form-box button:hover{
    background:#083567;
}

.preview{
    margin-top:30px;
}

.preview img{
    width:100%;
    max-width:600px;
    border-radius:10px;
    border:2px solid #ddd;
}

</style>

</head>

<body>

<div id="sidebar-placeholder"></div>

    <!-- Main Content -->

    <div class="main-content">

        <div class="topbar">
            <h3>Hero Banner Management</h3>
        </div>

        <div class="hero-card">

    <form id="heroForm">

        <div class="mb-3">
            <label class="form-label"><strong>Heading</strong></label>
            <input
                type="text"
                id="heading"
                class="form-control"
                placeholder="Enter Hero Heading">
        </div>

        <div class="mb-3">
            <label class="form-label"><strong>Sub Heading</strong></label>
            <textarea
                id="subHeading"
                class="form-control"
                rows="3"
                placeholder="Enter Hero Sub Heading"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label"><strong>Select Banner Image</strong></label>
            <input
                type="file"
                id="bannerImage"
                class="form-control"
                accept="image/*">
        </div>

        <div class="mb-4">
            <button id="saveHero" class="btn btn-primary">
                <i class="fas fa-save"></i>
                Save Hero Banner
            </button>
        </div>

    </form>

    <hr>

    <h5>Preview</h5>

    <img
        id="preview"
        src="../assets/images/no-image.png"
        style="max-width:100%;border-radius:10px;">

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/admin/sidebar.js"></script>
<script src="../js/hero.js"></script>
</body>
</html>
