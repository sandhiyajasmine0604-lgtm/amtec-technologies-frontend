<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - AMTEC Admin</title>
  <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Common Admin CSS -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/sidebar.css">


    
</head>

<body>
     <div id="sidebar-placeholder"></div>
     <div class="main-content">
<div class="content-box">

<h3>Contact Details</h3>

<form id="contactForm">

<div class="mb-3">
<label>Company Name</label>
<input type="text" id="company_name" class="form-control">
</div>

<div class="mb-3">
<label>Address</label>
<textarea id="address" class="form-control"></textarea>
</div>

<div class="row">

<div class="col-md-6">
<label>Phone 1</label>
<input type="text" id="phone1" class="form-control">
</div>

<div class="col-md-6">
<label>Phone 2</label>
<input type="text" id="phone2" class="form-control">
</div>

</div>

<br>

<div class="row">

<div class="col-md-6">
<label>Email</label>
<input type="email" id="email" class="form-control">
</div>

<div class="col-md-6">
<label>WhatsApp</label>
<input type="text" id="whatsapp" class="form-control">
</div>

</div>

<br>

<div class="mb-3">
<label>Google Map Link</label>
<textarea id="google_map" class="form-control"></textarea>
</div>

<div class="mb-3">
<label>Working Hours</label>
<input type="text" id="working_hours" class="form-control">
</div>

<div class="row">

<div class="col-md-3">
<label>Facebook</label>
<input type="text" id="facebook" class="form-control">
</div>

<div class="col-md-3">
<label>Instagram</label>
<input type="text" id="instagram" class="form-control">
</div>

<div class="col-md-3">
<label>LinkedIn</label>
<input type="text" id="linkedin" class="form-control">
</div>

<div class="col-md-3">
<label>YouTube</label>
<input type="text" id="youtube" class="form-control">
</div>

</div>

<br>

<button class="btn btn-primary">

Save Contact Details

</button>

</form>

</div>
<script src="../js/contact.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/admin/sidebar.js"></script>

</body>
</html>
