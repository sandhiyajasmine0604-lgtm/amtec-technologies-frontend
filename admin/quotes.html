<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quote Requests</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/sidebar.css">

</head>

<body>

<div id="sidebar-placeholder"></div>

<div class="main-content">

<div class="topbar">

<h2>Quote Requests</h2>

</div>

<div class="content-box">

<h3>Customer Quote Requests</h3>

<table class="table table-hover" id="quoteTable">

<thead>

<tr>

<th>ID</th>
<th>Customer</th>
<th>Company</th>
<th>Product</th>
<th>Phone</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>
<div class="modal fade" id="viewQuoteModal" tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h4>Quote Request Details</h4>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <table class="table table-bordered">

                    <tr>
                        <th width="30%">Customer Name</th>
                        <td id="v_customer_name"></td>
                    </tr>

                    <tr>
                        <th>Company</th>
                        <td id="v_company_name"></td>
                    </tr>

                    <tr>
                        <th>Email</th>
                        <td id="v_email"></td>
                    </tr>

                    <tr>
                        <th>Phone</th>
                        <td id="v_phone"></td>
                    </tr>

                    <tr>
                        <th>City</th>
                        <td id="v_city"></td>
                    </tr>

                    <tr>
                        <th>Product</th>
                        <td id="v_product"></td>
                    </tr>

                    <tr>
                        <th>Quantity</th>
                        <td id="v_quantity"></td>
                    </tr>

                    <tr>
                        <th>Message</th>
                        <td id="v_message"></td>
                    </tr>

                </table>

            </div>
            <hr>

<h5>Quotation</h5>

<div class="mb-3">

    <label class="form-label">
        Upload Quotation PDF
    </label>

    <input
        type="file"
        id="quotation_pdf"
        class="form-control"
        accept=".pdf">

</div>

<div id="currentQuotation" class="mt-2"></div>

<button
class="btn btn-success mt-3"
id="uploadQuotation">

Upload PDF

<button
id="sendWhatsapp"
class="btn btn-success">

<i class="fab fa-whatsapp"></i>

Send WhatsApp

</button>

                <button
                    class="btn btn-primary"
                    id="sendEmail">

                    <i class="fas fa-envelope"></i>

                    Email

                </button>

                <button
                    class="btn btn-warning"
                    id="generateQuote">

                    <i class="fas fa-file-pdf"></i>

                    Generate Quote

                </button>

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Close

                </button>

            </div>

        </div>

    </div>

</div>


<script src="../js/admin/add-solution.js"></script>

<script src="../js/admin/sidebar.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
