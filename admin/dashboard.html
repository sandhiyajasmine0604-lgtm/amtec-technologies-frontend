<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMTEC Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">

    <link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
 <link rel="stylesheet" href="../css/sidebar.css">
</head>

<body>
<div id="sidebar-placeholder"></div>
<div class="main-content">

    <!-- Main -->

    <div class="dashboard-header">

    <div>

        <h2>Dashboard</h2>

        <p>Welcome back, Administrator 👋</p>

    </div>

    <div class="dashboard-date">

        <i class="fas fa-calendar-alt"></i>

        <span id="todayDate"></span>

    </div>

</div>


<div class="dashboard-cards">

    <div class="dashboard-card">
        <div class="card-icon blue">
            <i class="fas fa-box"></i>
        </div>

        <div class="card-content">
            <h2 id="productCount">0</h2>
            <p>Total Products</p>
        </div>
    </div>

    <div class="dashboard-card">
        <div class="card-icon yellow">
            <i class="fas fa-list"></i>
        </div>

        <div class="card-content">
            <h2 id="categoryCount">0</h2>
            <p>Total Categories</p>
        </div>
    </div>

    <div class="dashboard-card">
        <div class="card-icon blue">
            <i class="fas fa-cogs"></i>
        </div>

        <div class="card-content">
            <h2 id="serviceCount">0</h2>
            <p>Total Services</p>
        </div>
    </div>

    <div class="dashboard-card">
        <div class="card-icon yellow">
            <i class="fas fa-handshake"></i>
        </div>

        <div class="card-content">
            <h2 id="brandCount">0</h2>
            <p>Total Brands</p>
        </div>
    </div>

</div>

<div class="dashboard-row">

    <div class="dashboard-panel latest-products">

        <div class="panel-header">
            <h4>Latest Products</h4>
            <a href="products.html">View All</a>
        </div>

        <table class="table align-middle" id="latestProductsTable">

            <thead>

                <tr>

                    <th>Image</th>
                    <th>Product</th>
                    <th>Status</th>
                    <th>Price</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>
   <div class="dashboard-panel">

    <div class="panel-header">
        <h4>Quick Actions</h4>
    </div>

    <div class="quick-grid">

        <a href="products.html" class="quick-card">
            <i class="fas fa-box"></i>
            <span>Add Product</span>
        </a>

        <a href="categories.html" class="quick-card">
            <i class="fas fa-folder-plus"></i>
            <span>Add Category</span>
        </a>

        <a href="services.html" class="quick-card">
            <i class="fas fa-cogs"></i>
            <span>Add Service</span>
        </a>

        <a href="brands.html" class="quick-card">
            <i class="fas fa-handshake"></i>
            <span>Add Brand</span>
        </a>

        <a href="hero.html" class="quick-card">
            <i class="fas fa-image"></i>
            <span>Hero Banner</span>
        </a>

        <a href="company.html" class="quick-card">
            <i class="fas fa-building"></i>
            <span>Company</span>
        </a>

    </div>

</div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>

<script src="../js/dashboard.js"></script>
<script src="../js/admin/sidebar.js"></script>
</body>
</html>
